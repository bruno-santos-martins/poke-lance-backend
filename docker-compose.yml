services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auction}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auction}
      POSTGRES_DB: ${POSTGRES_DB:-pokemon_auction}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: build
    command: npm run db:deploy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-auction}:${POSTGRES_PASSWORD:-auction}@postgres:5432/${POSTGRES_DB:-pokemon_auction}?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      target: build
    command: npm run db:seed
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-auction}:${POSTGRES_PASSWORD:-auction}@postgres:5432/${POSTGRES_DB:-pokemon_auction}?schema=public"
      UPLOADS_DIR: ./uploads
    volumes:
      - auction_uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-auction}:${POSTGRES_PASSWORD:-auction}@postgres:5432/${POSTGRES_DB:-pokemon_auction}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-37Zx-A3qc8o9wjCWOTg1NeHl3uomzFE6RfdMLeYy0QWwNzJAGkr2aDcK5pPAEA5y}
      PORT: 4000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      UPLOADS_DIR: ./uploads
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "4000:4000"
    volumes:
      - auction_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  postgres_data:
  auction_uploads:
